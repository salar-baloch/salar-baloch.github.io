const { useState, useEffect, useRef, useCallback } = React;
const { motion, useInView, useMotionValue, useTransform, useSpring, AnimatePresence } = window.Motion || window.FramerMotion || {};

/* ─── FRAMER SHIM if CDN key differs ─── */
const M = window.Motion || window.FramerMotion || window.framerMotion || {};
const Mot = M.motion || {};
const useInViewFn = M.useInView || ((ref) => { const [v,setV]=useState(false); useEffect(()=>{const o=new IntersectionObserver(([e])=>{if(e.isIntersecting)setV(true)},{threshold:0.1,rootMargin:'-60px'}); if(ref.current)o.observe(ref.current); return()=>o.disconnect()},[ref]); return v; });

/* ─── MOTION WRAPPER ─── */
function Fade({children, delay=0, x=0, y=32, style={}, once=true}){
  const ref=useRef(null);
  const [vis,setVis]=useState(false);
  useEffect(()=>{
    const o=new IntersectionObserver(([e])=>{if(e.isIntersecting){setVis(true);o.disconnect();}},{threshold:0.08,rootMargin:'-50px'});
    if(ref.current)o.observe(ref.current);
    return()=>o.disconnect();
  },[]);
  return(
    <div ref={ref} style={{
      opacity: vis?1:0,
      transform: vis?'none':`translate(${x}px,${y}px)`,
      transition:`opacity .7s ${delay}s cubic-bezier(0.16,1,0.3,1), transform .7s ${delay}s cubic-bezier(0.16,1,0.3,1)`,
      ...style
    }}>{children}</div>
  );
}

/* ─── CURSOR ─── */
function Cursor(){
  const [pos,setPos]=useState({x:-200,y:-200});
  const [rpos,setRpos]=useState({x:-200,y:-200});
  const [hov,setHov]=useState(false);
  const rx=useRef(-200),ry=useRef(-200);
  useEffect(()=>{
    const mv=e=>{setPos({x:e.clientX,y:e.clientY});};
    window.addEventListener('mousemove',mv);
    let raf;
    const loop=()=>{
      rx.current+=(pos.x-rx.current)*.11;
      ry.current+=(pos.y-ry.current)*.11;
      setRpos({x:rx.current,y:ry.current});
      raf=requestAnimationFrame(loop);
    };
    raf=requestAnimationFrame(loop);
    const addH=()=>document.querySelectorAll('a,button,[data-h]').forEach(el=>{
      el.addEventListener('mouseenter',()=>setHov(true));
      el.addEventListener('mouseleave',()=>setHov(false));
    });
    addH();
    return()=>{window.removeEventListener('mousemove',mv);cancelAnimationFrame(raf);};
  },[pos.x,pos.y]);
  return(<>
    <div style={{position:'fixed',width:9,height:9,borderRadius:'50%',background:'#22d3ee',left:pos.x,top:pos.y,transform:'translate(-50%,-50%)',pointerEvents:'none',zIndex:9999,mixBlendMode:'screen'}}/>
    <div style={{position:'fixed',width:hov?52:36,height:hov?52:36,borderRadius:'50%',border:`1.5px solid ${hov?'#22d3ee':'rgba(34,211,238,.4)'}`,left:rpos.x,top:rpos.y,transform:'translate(-50%,-50%)',pointerEvents:'none',zIndex:9998,transition:'width .2s,height .2s,border-color .2s'}}/>
  </>);
}

/* ─── TYPEWRITER ─── */
function Typewriter({words}){
  const [idx,setIdx]=useState(0);
  const [txt,setTxt]=useState('');
  const [del,setDel]=useState(false);
  useEffect(()=>{
    const word=words[idx];
    let t;
    if(!del&&txt.length<word.length) t=setTimeout(()=>setTxt(word.slice(0,txt.length+1)),80);
    else if(!del&&txt.length===word.length) t=setTimeout(()=>setDel(true),1800);
    else if(del&&txt.length>0) t=setTimeout(()=>setTxt(txt.slice(0,-1)),45);
    else if(del&&txt.length===0){setDel(false);setIdx((idx+1)%words.length);}
    return()=>clearTimeout(t);
  },[txt,del,idx,words]);
  return<span>{txt}<span style={{color:'#22d3ee',animation:'typeBar .6s infinite'}}>|</span></span>;
}

/* ─── SEC HEADER ─── */
function SecHeader({num,title}){
  const ref=useRef(null);
  const [vis,setVis]=useState(false);
  useEffect(()=>{
    const o=new IntersectionObserver(([e])=>{if(e.isIntersecting){setVis(true);o.disconnect();}},{threshold:0.1,rootMargin:'-60px'});
    if(ref.current)o.observe(ref.current);
    return()=>o.disconnect();
  },[]);
  return(
    <div ref={ref} style={{display:'flex',alignItems:'center',gap:20,marginBottom:64}}>
      <span style={{fontFamily:'Bebas Neue',fontSize:14,color:'#22d3ee',letterSpacing:3,opacity:vis?1:0,transition:'opacity .5s, transform .5s',transform:vis?'none':'translateX(-20px)'}}>{num}</span>

      <div style={{flex:1,height:1,background:'rgba(255,255,255,0.08)',transform:vis?'scaleX(1)':'scaleX(0)',transformOrigin:'left',transition:'transform .7s .2s'}}/>
    </div>
  );
}
