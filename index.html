<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060810;--bg2:#0a0d18;--surface:#101420;--surface2:#161b2e;
  --border:rgba(255,255,255,0.08);--border-hi:rgba(255,255,255,0.18);
  --text:#f1f3fb;--sub:#b0bcd8;--dim:#6b7a9e;
  --cyan:#22d3ee;--violet:#a78bfa;--amber:#fbbf24;--green:#34d399;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;font-size:16px;line-height:1.6;overflow-x:hidden;cursor:none}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:rgba(34,211,238,0.4);border-radius:4px}
::selection{background:rgba(34,211,238,0.25);color:var(--text)}
a,button{cursor:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}100%{box-shadow:0 0 0 10px rgba(52,211,153,0)}}
@keyframes gridMove{0%{background-position:0 0}100%{background-position:60px 60px}}
@keyframes float{0%,100%{transform:translateY(0) scale(1);opacity:.3}50%{transform:translateY(-28px) scale(1.3);opacity:.8}}
@keyframes glowPulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
@keyframes barIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:translateY(0)}}
@keyframes typeBar{0%,100%{opacity:1}50%{opacity:0}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
</style>
</head>
